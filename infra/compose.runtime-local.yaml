# Local Docker runtime with read-only workspace artifacts, avoiding duplicate OCR layers
# inside the space-constrained Docker VM. Run pnpm build before recreating services.
services:
  gateway:
    image: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
    command: [node, dist/apps/gateway/src/server.js]
    working_dir: /app
    user: node
    volumes:
      - ../dist:/app/dist:ro
      - ../node_modules:/app/node_modules:ro
      - ../package.json:/app/package.json:ro
  school-adapter:
    image: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
    working_dir: /app
    user: node
    volumes:
      - ../dist:/app/dist:ro
      - ../node_modules:/app/node_modules:ro
      - ../package.json:/app/package.json:ro
