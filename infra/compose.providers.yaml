# Explicit opt-in after tariff verification. Worker still remains disabled.
services:
  gateway:
    volumes: ['../dist/apps/gateway/src:/app/dist/apps/gateway/src:ro']
    environment:
      GOOGLE_SEARCH_ENABLED: ${GOOGLE_SEARCH_ENABLED:-false}
      GOOGLE_SEARCH_MAX_COST_MICRO_USD: ${GOOGLE_SEARCH_MAX_COST_MICRO_USD:-0}
      GEMINI_PROXY_TOKEN: ${GEMINI_PROXY_TOKEN}
      GEMINI_CHAT_KEY: ${GEMINI_CHAT_KEY}
      GEMINI_EMBEDDING_KEY: ${GEMINI_EMBEDDING_KEY}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL}
      GEMINI_CHAT_MAX_COST_MICRO_USD: ${GEMINI_CHAT_MAX_COST_MICRO_USD}
      GEMINI_EMBEDDING_MAX_COST_MICRO_USD: ${GEMINI_EMBEDDING_MAX_COST_MICRO_USD}
      PROVIDER_DAILY_BUDGET_MICRO_USD: ${PROVIDER_DAILY_BUDGET_MICRO_USD}
      PROVIDER_TOTAL_BUDGET_MICRO_USD: ${PROVIDER_TOTAL_BUDGET_MICRO_USD}
