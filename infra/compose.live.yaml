# Additive local deployment; only the narrow host ingress/tunnel is public.
services:
  gateway:
    build: {context: .., dockerfile: infra/live.Dockerfile}
    image: campus-agent-live:local
    environment:
      APP_MODE: live
      HOST: 0.0.0.0
      PORT: 3100
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID}
      LINE_MESSAGING_CHANNEL_ID: ${LINE_MESSAGING_CHANNEL_ID}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:?Required}
      LINE_ACCESS_TOKEN: ${LINE_ACCESS_TOKEN:?Set LINE_ACCESS_TOKEN in .env}
      LINE_DESTINATION: ${LINE_DESTINATION:?Set LINE_DESTINATION in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      LIFF_ID: ${LIFF_ID}
      SCHOOL_ORIGIN: http://school-adapter:3200
      SCHOOL_SERVICE_TOKEN: ${SCHOOL_SERVICE_TOKEN}
      LIVE_AGENT_ENABLED: ${LIVE_AGENT_ENABLED:-false}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/campus-agent-live
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:?Set N8N_WEBHOOK_TOKEN in .env}
      PROVIDER_DAILY_BUDGET_MICRO_USD: '0'
      PROVIDER_TOTAL_BUDGET_MICRO_USD: '0'
    ports: ['127.0.0.1:3100:3100']
    networks: [synthetic, management]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres: {condition: service_healthy}
      school-adapter: {condition: service_healthy}
      n8n: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3100/health/live')
          .then(r=>{if(!r.ok)process.exit(1)})
          .catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  school-adapter:
    image: campus-agent-live:local
    command: [node, dist/apps/school-adapter/src/server.js]
    environment:
      SCHOOL_HOST: 0.0.0.0
      SCHOOL_PORT: 3200
      SCHOOL_DATABASE_URL: ${SCHOOL_DATABASE_URL:?Required}
      SCHOOL_SERVICE_TOKEN: ${SCHOOL_SERVICE_TOKEN}
      SCHOOL_SESSION_KEY: ${SCHOOL_SESSION_KEY}
      SCHOOL_ACCOUNT_HASH_KEY: ${SCHOOL_ACCOUNT_HASH_KEY}
    networks: [synthetic, management]
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    mem_limit: 1536m
    cpus: 2
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3200/health/live')
          .then(r=>{if(!r.ok)process.exit(1)})
          .catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
