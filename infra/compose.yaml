name: campus-phase1
services:
  postgres:
    build:
      context: ..
      dockerfile: infra/postgres.Dockerfile
    environment:
      POSTGRES_USER: bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin
    secrets: [postgres_admin, n8n_db_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [synthetic]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bootstrap -d postgres']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  mock-gateway:
    build:
      context: ..
      dockerfile: infra/mock.Dockerfile
    environment:
      APP_MODE: synthetic
      PORT: 3000
      MOCK_TASK_TOKEN_FILE: /run/secrets/task
      MOCK_DEMO_TOKEN_FILE: /run/secrets/demo
      MOCK_MAINTENANCE_TOKEN_FILE: /run/secrets/maintenance
      MOCK_KNOWLEDGE_TOKEN_FILE: /run/secrets/knowledge
      MOCK_OBSERVABILITY_TOKEN_FILE: /run/secrets/observability
    secrets: [task, demo, maintenance, knowledge, observability]
    networks: [synthetic]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.7@sha256:bcef56dd44014e09774219536a3f8cb07f1b553fcba94044bd9fc0f21f8676a3
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n_db_password
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:15679/
      WEBHOOK_URL: http://n8n:5678/
      N8N_SECURE_COOKIE: 'false'
      GENERIC_TIMEZONE: Asia/Taipei
      TZ: Asia/Taipei
      EXECUTIONS_MODE: regular
      EXECUTIONS_TIMEOUT: 100
      EXECUTIONS_TIMEOUT_MAX: 600
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: 'false'
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'true'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: 24
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 5
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
    secrets: [n8n_db_password, n8n_encryption]
    volumes:
      - n8n_data:/home/node/.n8n
      - ../workflows:/import:ro
      - ../.local:/handoff
    networks: [synthetic]
    depends_on:
      postgres: {condition: service_healthy}
      mock-gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s
    restart: unless-stopped
  admin-proxy:
    image: node:24.14.0-alpine3.23@sha256:7fddd9ddeae8196abf4a3ef2de34e11f7b1a722119f91f28ddf1e99dcafdf114
    command: [node, /proxy.mjs]
    user: node
    volumes: ['./admin-proxy.mjs:/proxy.mjs:ro']
    ports: ['127.0.0.1:15679:5678']
    networks: [synthetic, management]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      n8n: {condition: service_healthy}
    restart: unless-stopped
networks:
  management:
  synthetic:
    internal: true
volumes:
  postgres_data:
  n8n_data:
secrets:
  postgres_admin: {file: ../.local/secrets/postgres_admin}
  n8n_db_password: {file: ../.local/secrets/n8n_db_password}
  n8n_encryption: {file: ../.local/secrets/n8n_encryption}
  task: {file: ../.local/secrets/task}
  demo: {file: ../.local/secrets/demo}
  maintenance: {file: ../.local/secrets/maintenance}
  knowledge: {file: ../.local/secrets/knowledge}
  observability: {file: ../.local/secrets/observability}
