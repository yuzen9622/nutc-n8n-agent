# Keep this project name stable: it identifies your persistent volumes.
name: nutc-agent
x-live: &live
  image: nutc-agent-live:local
  build:
    context: .
    dockerfile: Dockerfile
    target: live
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
      target: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  n8n:
    image: "docker.n8n.io/n8nio/n8n:2.41.7@sha256:\
      bcef56dd44014e09774219536a3f8cb07f1b553fcba94044bd9fc0f21f8676a3"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Required}
      N8N_SECURE_COOKIE: 'false'
      GENERIC_TIMEZONE: Asia/Taipei
      TZ: Asia/Taipei
      EXECUTIONS_TIMEOUT: 100
      EXECUTIONS_TIMEOUT_MAX: 600
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: 'false'
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: 24
      # Five Agent tasks plus up to five nested search executions.
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 10
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
    ports: ['127.0.0.1:${N8N_EDITOR_PORT:-15679}:5678']
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/import:ro
      - ./scripts/setup-n8n.mjs:/opt/campus/setup-n8n.mjs:ro
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:5678/healthz/readiness')
          .then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    restart: unless-stopped

  school-adapter:
    <<: *live
    command:
      - sh
      - -c
      - >-
        node scripts/migrate-live-database.mjs --container &&
        exec node dist/apps/school-adapter/src/server.js
    environment:
      SCHOOL_HOST: 0.0.0.0
      SCHOOL_PORT: 3200
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?Required}
    networks: [backend]
    tmpfs: ['/tmp:size=32m,mode=1777']
    mem_limit: 1536m
    cpus: 2
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3200/health/live')
          .then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 30s

  gateway:
    <<: *live
    stop_grace_period: 150s
    environment:
      APP_MODE: live
      HOST: 0.0.0.0
      PORT: 3100
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?Required}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:?Required}
      LINE_MESSAGING_CHANNEL_ID: ${LINE_MESSAGING_CHANNEL_ID:?Required}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:?Required}
      LINE_ACCESS_TOKEN: ${LINE_ACCESS_TOKEN:?Required}
      LINE_DESTINATION: ${LINE_DESTINATION:?Required}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Required}
      LIFF_ID: ${LIFF_ID:?Required}
      SCHOOL_ORIGIN: http://school-adapter:3200
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/campus-agent-live
      GOOGLE_SEARCH_ENABLED: ${GOOGLE_SEARCH_ENABLED:-false}
    ports: ['127.0.0.1:3100:3100']
    networks: [backend, public]
    depends_on:
      school-adapter: {condition: service_healthy}
      n8n: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          Promise.all([
          fetch('http://127.0.0.1:3100/health/live')
          .then(r=>{if(!r.ok)throw Error()}),
          new Promise((resolve,reject)=>require('node:http')
          .get('http://127.0.0.1:3101/liff/',
          {headers:{host:new URL(process.env.PUBLIC_ORIGIN).host}},
          r=>{r.resume();r.statusCode===200?resolve():reject()})
          .on('error',reject))
          ]).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 30s

  cloudflared:
    image: "cloudflare/cloudflared:2026.6.1@sha256:\
      6d91c121b803126f7a5344005d17a9324788fc09d305b6e2560ec6040a7ae283"
    command: >-
      tunnel --no-autoupdate --url http://gateway:3101
      --metrics 0.0.0.0:20311 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Required}
    networks: [public]
    depends_on:
      gateway: {condition: service_healthy}
    restart: unless-stopped

networks:
  backend:
  public:
volumes:
  postgres_data:
  n8n_data:
