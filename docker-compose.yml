# Keep the existing project name so persistent volumes retain their identity.
name: campus-phase1
x-n8n-db: &n8n-db
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD:?Required}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Required}
x-live: &live
  image: campus-agent-live:local
  build:
    context: .
    dockerfile: Dockerfile
    target: live
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
      target: postgres
    environment:
      POSTGRES_USER: bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      N8N_DB_PASSWORD: ${DB_POSTGRESDB_PASSWORD:?Required}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?Required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [synthetic]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U bootstrap -d postgres']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *live
    command: [node, scripts/migrate-live-database.mjs, --container]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Required}
    networks: [synthetic]
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'
  n8n-init:
    image: campus-agent-n8n-init:local
    build:
      context: .
      dockerfile: Dockerfile
      target: n8n-init
    environment:
      <<: *n8n-db
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?Required}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Required}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:?Required}
      GEMINI_PROXY_TOKEN: ${GEMINI_PROXY_TOKEN:?Required}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      GENERIC_TIMEZONE: Asia/Taipei
      TZ: Asia/Taipei
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /home/node/.n8n:uid=1000,gid=1000,mode=0700,size=32m
      - /tmp:size=32m,mode=1777
    networks: [synthetic]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: 'no'
  n8n:
    image: "docker.n8n.io/n8nio/n8n:2.41.7@sha256:\
      bcef56dd44014e09774219536a3f8cb07f1b553fcba94044bd9fc0f21f8676a3"
    environment:
      <<: *n8n-db
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:15679/
      WEBHOOK_URL: http://n8n:5678/
      N8N_SECURE_COOKIE: 'false'
      GENERIC_TIMEZONE: Asia/Taipei
      TZ: Asia/Taipei
      EXECUTIONS_MODE: regular
      EXECUTIONS_TIMEOUT: 100
      EXECUTIONS_TIMEOUT_MAX: 600
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: 'false'
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: 24
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 5
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
    ports: ['127.0.0.1:15679:5678']
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/import:ro
      - ./.local:/handoff
    networks: [synthetic, management]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      n8n-init: {condition: service_completed_successfully}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:5678/healthz/readiness')
          .then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s
    restart: unless-stopped
  gateway:
    <<: *live
    # Drain bounded in-flight n8n dispatch before Docker sends SIGKILL.
    stop_grace_period: 150s
    environment:
      APP_MODE: live
      HOST: 0.0.0.0
      PORT: 3100
      DATABASE_URL: ${DATABASE_URL:?Required}
      SESSION_SECRET: ${SESSION_SECRET:?Required}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Required}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:?Required}
      LINE_MESSAGING_CHANNEL_ID: ${LINE_MESSAGING_CHANNEL_ID:?Required}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:?Required}
      LINE_ACCESS_TOKEN: ${LINE_ACCESS_TOKEN:?Required}
      LINE_DESTINATION: ${LINE_DESTINATION:?Required}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Required}
      LIFF_ID: ${LIFF_ID:?Required}
      SCHOOL_ORIGIN: http://school-adapter:3200
      SCHOOL_SERVICE_TOKEN: ${SCHOOL_SERVICE_TOKEN:?Required}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/campus-agent-live
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:?Required}
      GOOGLE_SEARCH_ENABLED: ${GOOGLE_SEARCH_ENABLED:-false}
      GEMINI_PROXY_TOKEN: ${GEMINI_PROXY_TOKEN:?Required}
      GEMINI_CHAT_KEY: ${GEMINI_CHAT_KEY:-}
      GEMINI_EMBEDDING_KEY: ${GEMINI_EMBEDDING_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-models/gemini-3.8-flash}
      GEMINI_EMBEDDING_MODEL:
        ${GEMINI_EMBEDDING_MODEL:-models/gemini-embedding-001}
    ports: ['127.0.0.1:3100:3100']
    networks: [synthetic, management, ingress-gateway]
    depends_on:
      migrate: {condition: service_completed_successfully}
      school-adapter: {condition: service_healthy}
      n8n: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3100/health/live')
          .then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 10
  school-adapter:
    <<: *live
    command: [node, dist/apps/school-adapter/src/server.js]
    environment:
      SCHOOL_HOST: 0.0.0.0
      SCHOOL_PORT: 3200
      SCHOOL_DATABASE_URL: ${SCHOOL_DATABASE_URL:?Required}
      SCHOOL_SERVICE_TOKEN: ${SCHOOL_SERVICE_TOKEN:?Required}
      SCHOOL_SESSION_KEY: ${SCHOOL_SESSION_KEY:?Required}
      SCHOOL_ACCOUNT_HASH_KEY: ${SCHOOL_ACCOUNT_HASH_KEY:?Required}
    networks: [synthetic, management]
    tmpfs: ['/tmp:size=32m,mode=1777']
    mem_limit: 1536m
    cpus: 2
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3200/health/live')
          .then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 10
  public-ingress:
    <<: *live
    command: [node, dist/apps/gateway/src/public-server.js]
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Required}
      LIFF_ID: ${LIFF_ID:?Required}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:?Required}
      PUBLIC_HOST: 0.0.0.0
      PUBLIC_GATEWAY_ORIGIN: http://gateway:3100
    # No host port: only the tunnel reaches the allowlisted LINE/LIFF surface.
    networks: [public, ingress-gateway]
    depends_on:
      gateway: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const host=new URL(process.env.PUBLIC_ORIGIN).host;
          require('node:http').get('http://127.0.0.1:3101/liff/',
          {headers:{host}},r=>{r.resume();if(r.statusCode!==200)process.exit(1)})
          .on('error',()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 10
  tunnel:
    <<: *live
    image: campus-agent-tunnel:local
    build:
      context: .
      dockerfile: Dockerfile
      target: tunnel
    command: [node, scripts/start-tunnel.mjs]
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Required}
      TUNNEL_CRED_CONTENTS: ${TUNNEL_CRED_CONTENTS:?Required tunnel credentials}
      TUNNEL_INGRESS_ORIGIN: http://public-ingress:3101
    tmpfs: ['/tmp:size=16m,mode=1777']
    networks: [public, egress]
    depends_on:
      public-ingress: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:20311/ready')
          .then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
networks:
  management:
  public:
    internal: true
  ingress-gateway:
    internal: true
  egress:
  # Historical network name retained for compatibility; no mock services remain.
  synthetic:
    internal: true
volumes:
  postgres_data:
  n8n_data:
